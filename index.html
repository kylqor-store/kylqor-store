
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>KYLQOR — Beyond Ordinary</title>
  <meta name="description" content="KYLQOR premium unisex streetwear. Beyond Ordinary.">

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px;
      border-bottom: 1px solid #292929;
      text-align: center;
    }
    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 7px;
    }
    .tagline {
      color: #999;
      font-size: 11px;
      letter-spacing: 4px;
      margin-top: 9px;
    }
    main {
      width: min(900px, 92%);
      margin: 55px auto;
    }
    h1 {
      font-size: clamp(32px, 7vw, 60px);
      letter-spacing: 3px;
      text-align: center;
    }
    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 45px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .product {
      background: #141414;
      border: 1px solid #303030;
      padding: 25px;
    }
    .product h2 { font-size: 19px; }
    .price { color: #ccc; font-size: 20px; }
    button {
      background: #fff;
      color: #080808;
      border: 0;
      padding: 14px 20px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .checkout {
      margin-top: 45px;
      padding: 25px;
      background: #141414;
      border: 1px solid #303030;
    }
    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      background: #080808;
      border: 1px solid #444;
      color: white;
    }
    label { color: #ccc; font-size: 13px; }
    .captcha { margin: 20px 0; }
    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      border-top: 1px solid #292929;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">KYLQOR</div>
    <div class="tagline">BEYOND ORDINARY..</div>
  </header>

  <main>
    <h1>THE NEW STANDARD.</h1>
    <p class="subtitle">Premium unisex streetwear.</p>

    <section class="products">
      <article class="product">
        <h2>DROP 001 — GRAPHIC TEE</h2>
        <p class="price">₹799</p>
        <button type="button" onclick="addToCart('tee-001')">
          ADD TO CART
        </button>
      </article>

      <article class="product">
        <h2>DROP 001 — SIGNATURE TEE</h2>
        <p class="price">₹799</p>
        <button type="button" onclick="addToCart('tee-002')">
          ADD TO CART
        </button>
      </article>
    </section>

    <section class="checkout">
      <h2>YOUR CHECKOUT</h2>
      <p id="cart-summary">Your cart is empty.</p>

      <form id="checkout-form">
        <label for="customer-name">Full name</label>
        <input id="customer-name" name="name" required maxlength="100">

        <label for="phone">Phone number (+91)</label>
        <input id="phone" name="phone" placeholder="+91XXXXXXXXXX" required>

        <label for="address">Full address</label>
        <textarea id="address" name="address" required maxlength="300"></textarea>

        <label for="city">City</label>
        <input id="city" name="city" required maxlength="80">

        <label for="pincode">PIN code</label>
        <input id="pincode" name="pincode" inputmode="numeric"
          pattern="[0-9]{6}" required>

        <div class="captcha">
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFwdrKRj8oDOORop"
          ></div>
        </div>

        <button type="submit">PLACE COD ORDER</button>
      </form>

      <p id="order-message" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    KYLQOR © 2026 — BEYOND ORDINARY..
  </footer>

  <script src="app.js"></script>
</body>
</html>
